  <!-- Sentul Nirwana Typography -->
  <text x="68" y="26" fill="#ffffff" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="16" font-weight="700" letter-spacing="0.12em">SENTUL NIRWANA</text>
  <text x="69" y="38" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="6.5" font-weight="600" letter-spacing="0.28em" opacity="0.85">TOWNSHIP &amp; RESORT</text>
