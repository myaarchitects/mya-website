    <path d="M4 34 C12 22 22 14 36 20 C42 22 46 28 50 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- Middle Mountain Ridge -->
    <path d="M12 34 C19 18 29 10 39 15 C44 17 48 24 54 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
